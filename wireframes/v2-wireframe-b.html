<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V2 Wireframe B — Holographic Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050607;                 /* deep space */
      --panel:rgba(255,255,255,0.06);/* glass */
      --stroke:rgba(255,255,255,0.18);
      --red:#EC1E24;              
      --white:#ffffff;
    }
    html,body{height:100%}
    body{margin:0;background:var(--bg);display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--white)}

    /* Subtle holographic backdrop grid */
    body:before{
      content:"";position:fixed;inset:0;
      background:
        radial-gradient(1200px 800px at 80% 10%, rgba(236,30,36,.08), transparent 60%),
        radial-gradient(1000px 700px at 20% 90%, rgba(255,255,255,.06), transparent 55%),
        linear-gradient(transparent 24px, rgba(255,255,255,.03) 25px, transparent 26px),
        linear-gradient(90deg, transparent 24px, rgba(255,255,255,.03) 25px, transparent 26px);
      background-size: auto, auto, 50px 50px, 50px 50px;
      pointer-events:none;
    }

    .screen{width:1080px;height:1920px;position:relative;overflow:hidden}

    /* Shared brand bar */
    .brandbar{position:absolute;top:40px;left:60px;right:60px;z-index:20;display:flex;justify-content:space-between;align-items:center}
    .brand{font-size:36px;font-weight:600;letter-spacing:2px;text-shadow:0 0 18px rgba(236,30,36,.35)}
    .actions{display:flex;gap:12px}
    .btn-glass{backdrop-filter: blur(10px);-webkit-backdrop-filter: blur(10px);background:var(--panel);border:1px solid var(--stroke);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.04)}
    .btn-glass:hover{border-color:rgba(236,30,36,.6);box-shadow:0 0 0 1px rgba(236,30,36,.35), 0 8px 28px rgba(236,30,36,.18)}

    /* Panels */
    .panel{position:absolute;inset:0;padding:0 0}

    /* ---- GALLERY ---- */
    #gallery{display:block}
    .filters{position:absolute;top:100px;left:60px;right:60px;display:flex;gap:10px}
    .chip{backdrop-filter: blur(8px);-webkit-backdrop-filter: blur(8px);background:var(--panel);border:1px solid var(--stroke);border-radius:999px;padding:6px 12px;font-size:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
    .gallery-wrap{position:absolute;top:150px;left:60px;right:60px;bottom:260px;display:grid;grid-template-columns:repeat(3,1fr);gap:36px}
    .thumb{position:relative;border-radius:16px;background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid var(--stroke);backdrop-filter: blur(12px);-webkit-backdrop-filter: blur(12px);
      display:grid;place-items:center;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease}
    .thumb:before{content:"";position:absolute;inset:-1px;border-radius:16px;box-shadow:0 0 24px rgba(236,30,36,.18), inset 0 0 0 1px rgba(255,255,255,.05);pointer-events:none}
    .thumb:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.45)}
    .tlabel{opacity:.8;letter-spacing:.08em}

    /* ---- VIDEO ---- */
    #video{display:none}
    .nowplaying{position:absolute;top:100px;right:60px;font-size:16px;opacity:.85}
    .back-btn{position:absolute;top:96px;left:60px}

    .video-area{position:absolute;left:60px;right:60px;top:150px;bottom:300px;border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      border:1px solid var(--stroke);backdrop-filter: blur(14px);-webkit-backdrop-filter: blur(14px);
      box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 100px rgba(236,30,36,.06);
      display:grid;place-items:center}
    .video-label{opacity:.75;font-size:20px;letter-spacing:.08em}

    .controls{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);display:flex;gap:36px}
    .cbtn{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:26px;cursor:pointer;
      background:var(--panel);border:1px solid var(--stroke);backdrop-filter: blur(10px);-webkit-backdrop-filter: blur(10px);
      box-shadow:0 10px 26px rgba(0,0,0,.45), 0 0 0 2px rgba(236,30,36,.18) inset}
    .cbtn:hover{box-shadow:0 10px 26px rgba(0,0,0,.45), 0 0 0 2px rgba(236,30,36,.45) inset}

    .timeline{position:absolute;left:160px;right:160px;bottom:110px;height:8px;border-radius:8px;overflow:hidden;
      background:linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,.08))}
    .fill{height:100%;width:42%;background:linear-gradient(90deg, var(--red), #ff6b6b)}
    .timecodes{position:absolute;left:160px;right:160px;bottom:72px;display:flex;justify-content:space-between;font-size:14px;opacity:.82}

    /* Animations / utilities */
    .fade{transition:opacity .22s ease}
  </style>
</head>
<body>
  <div class="screen">
    <!-- Shared Brand Bar -->
    <div class="brandbar">
      <div class="brand">V2 INDONESIA</div>
      <div class="actions">
        <button id="btnGallery" class="btn-glass">View: Gallery</button>
        <button id="btnVideo" class="btn-glass">View: Video</button>
      </div>
    </div>

    <!-- GALLERY VIEW (Glass cards) -->
    <section id="gallery" class="panel fade" style="opacity:1">
      <div class="filters">
        <div class="chip">All</div><div class="chip">Event</div><div class="chip">Retail</div><div class="chip">Corporate</div>
      </div>
      <div class="gallery-wrap">
        <div class="thumb" data-title="Demo Reel 01"><div class="tlabel">Video 01</div></div>
        <div class="thumb" data-title="Grand Indonesia 16th"><div class="tlabel">Video 02</div></div>
        <div class="thumb" data-title="Nestlé Pop-up"><div class="tlabel">Video 03</div></div>
        <div class="thumb" data-title="Forum Satu Data"><div class="tlabel">Video 04</div></div>
        <div class="thumb" data-title="GIAS Kiosk"><div class="tlabel">Video 05</div></div>
        <div class="thumb" data-title="Press Conference"><div class="tlabel">Video 06</div></div>
      </div>
    </section>

    <!-- VIDEO VIEW (Holographic panel) -->
    <section id="video" class="panel fade" style="opacity:0; display:none">
      <button id="back" class="btn-glass back-btn">← Back to Gallery</button>
      <div id="nowPlaying" class="nowplaying">Now Playing • —</div>

      <div class="video-area"><div class="video-label">VIDEO AREA (Holographic Panel)</div></div>

      <div class="controls">
        <div class="cbtn" title="Previous">⏮</div>
        <div class="cbtn" title="Pause">⏸</div>
        <div class="cbtn" title="Play">▶</div>
        <div class="cbtn" title="Next">⏭</div>
        <div class="cbtn" title="Volume">🔊</div>
      </div>

      <div class="timeline"><div class="fill" id="fill"></div></div>
      <div class="timecodes"><span>00:42</span><span>03:18</span></div>
    </section>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const video = document.getElementById('video');
    const btnGallery = document.getElementById('btnGallery');
    const btnVideo = document.getElementById('btnVideo');
    const back = document.getElementById('back');
    const nowPlaying = document.getElementById('nowPlaying');
    const fill = document.getElementById('fill');

    function toGallery(){
      video.style.opacity = 0;
      setTimeout(()=>{ video.style.display='none'; gallery.style.display='block'; requestAnimationFrame(()=> gallery.style.opacity = 1); }, 220);
    }
    function toVideo(){
      gallery.style.opacity = 0;
      setTimeout(()=>{ gallery.style.display='none'; video.style.display='block'; requestAnimationFrame(()=> video.style.opacity = 1); }, 220);
    }

    btnGallery.addEventListener('click', toGallery);
    btnVideo.addEventListener('click', toVideo);
    back.addEventListener('click', toGallery);

    document.querySelectorAll('.thumb').forEach(t => {
      t.addEventListener('click', () => {
        const title = t.getAttribute('data-title') || 'Selected Video';
        nowPlaying.textContent = `Now Playing • ${title}`;
        toVideo();
      });
    });

    // Demo timeline animation
    let p = 0; setInterval(()=>{ if(video.style.display!=='block') return; p=(p+1)%100; fill.style.width = p+"%"; }, 80);

    // Start in Gallery
    toGallery();
  </script>
</body>
</html>
