<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V2 Wireframe – Gallery & Video (A)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#000000;                 /* full-page plain black */
      --red:#EC1E24;                /* V2 red */
    }

    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);         /* fills entire page */
      display:grid; place-items:center;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:#fff;
    }

    /* 1080×1920 canvas */
    .screen{
      width:1080px; height:1920px;
      background:#0A0A0A;
      color:#fff; position:relative; overflow:hidden;
      /* removed the black side borders */
    }

    /* Shared brand bar */
    .brandbar{
      position:absolute; top:40px; left:60px; right:60px; z-index:10;
      display:flex; justify-content:space-between; align-items:center;
    }
    .brand{font-size:36px; font-weight:600; letter-spacing:2px}
    .actions{display:flex; gap:12px}
    .btn-ghost{
      background:transparent; border:1px solid rgba(255,255,255,.25);
      color:#fff; border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer;
    }
    .btn-ghost:hover{border-color:var(--red)}

    /* ---- GALLERY (Minimal Tech Grid) ---- */
    #gallery{position:absolute; inset:0}
    .filters{position:absolute; top:100px; left:60px; right:60px; display:flex; gap:10px; opacity:.8; font-size:14px}
    .chip{border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:6px 10px}
    .gallery-wrap{
      position:absolute; top:140px; left:60px; right:60px; bottom:240px;
      display:grid; grid-template-columns:repeat(3,1fr); gap:40px;
    }
    .thumb{
      border:1px solid var(--red); border-radius:12px;
      background:linear-gradient(180deg,#1a1a1a,#101010);
      display:grid; place-items:center; cursor:pointer; transition:.15s;
    }
    .thumb:hover{transform:translateY(-2px)}
    .tlabel{opacity:.7; letter-spacing:.08em}

    /* ---- VIDEO ---- */
    #video{position:absolute; inset:0; display:none}
    .nowplaying{position:absolute; top:100px; right:60px; font-size:16px; opacity:.8; z-index:9}
    .back-btn{position:absolute; top:96px; left:60px; z-index:9}

    .video-area{
      position:absolute; left:60px; right:60px; top:140px; bottom:240px;
      background:linear-gradient(180deg,#1a1a1a,#101010);
      border:1px solid rgba(236,30,36,.35); border-radius:12px;
      display:grid; place-items:center;
    }
    .video-label{opacity:.65; font-size:22px; letter-spacing:.08em}

    .controls{
      position:absolute; left:50%; bottom:110px; transform:translateX(-50%);
      display:flex; gap:40px; align-items:center; justify-content:center;
    }
    .cbtn{
      width:72px; height:72px; border:2px solid var(--red); border-radius:50%;
      display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer;
      background:transparent;
    }
    .timeline{position:absolute; left:160px; right:160px; bottom:80px; height:6px;
      background:rgba(255,255,255,.18); border-radius:4px; overflow:hidden}
    .fill{width:42%; height:100%; background:var(--red)}
    .timecodes{position:absolute; left:160px; right:160px; bottom:40px;
      display:flex; justify-content:space-between; font-size:14px; opacity:.75}

    /* Simple transitions */
    .fade{transition:opacity .18s ease}
  </style>
</head>
<body>
  <div class="screen">
    <!-- Single, shared header -->
    <div class="brandbar">
      <div class="brand">V2 INDONESIA</div>
      <div class="actions">
        <button id="toggleToGallery" class="btn-ghost">View: Gallery</button>
        <button id="toggleToVideo" class="btn-ghost">View: Video</button>
      </div>
    </div>

    <!-- GALLERY VIEW -->
    <section id="gallery" class="fade" style="opacity:1">
      <div class="filters">
        <div class="chip">All</div><div class="chip">Event</div>
        <div class="chip">Retail</div><div class="chip">Corporate</div>
      </div>
      <div class="gallery-wrap">
        <div class="thumb" data-title="Demo Reel 01"><div class="tlabel">Video 01</div></div>
        <div class="thumb" data-title="Grand Indonesia 16th"><div class="tlabel">Video 02</div></div>
        <div class="thumb" data-title="Nestlé Pop-up"><div class="tlabel">Video 03</div></div>
        <div class="thumb" data-title="Forum Satu Data"><div class="tlabel">Video 04</div></div>
        <div class="thumb" data-title="GIAS Kiosk"><div class="tlabel">Video 05</div></div>
        <div class="thumb" data-title="Press Conference"><div class="tlabel">Video 06</div></div>
      </div>
    </section>

    <!-- VIDEO VIEW -->
    <section id="video" class="fade" style="opacity:0; display:none">
      <button id="backToGallery" class="btn-ghost back-btn">← Back to Gallery</button>
      <div id="nowPlaying" class="nowplaying">Now Playing • —</div>

      <div class="video-area"><div class="video-label">VIDEO AREA (1080×1920 mock)</div></div>

      <div class="controls">
        <div class="cbtn" title="Previous">⏮</div>
        <div class="cbtn" title="Pause">⏸</div>
        <div class="cbtn" title="Play">▶</div>
        <div class="cbtn" title="Next">⏭</div>
        <div class="cbtn" title="Volume">🔊</div>
      </div>

      <div class="timeline"><div class="fill" id="fill"></div></div>
      <div class="timecodes"><span id="elapsed">00:42</span><span id="total">03:18</span></div>
    </section>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const video = document.getElementById('video');
    const toGallery = document.getElementById('toggleToGallery');
    const toVideo = document.getElementById('toggleToVideo');
    const back = document.getElementById('backToGallery');
    const nowPlaying = document.getElementById('nowPlaying');
    const fill = document.getElementById('fill');

    function showGallery(){
      video.style.opacity = 0;
      setTimeout(()=>{ video.style.display='none'; gallery.style.display='block'; requestAnimationFrame(()=> gallery.style.opacity = 1); }, 180);
    }
    function showVideo(){
      gallery.style.opacity = 0;
      setTimeout(()=>{ gallery.style.display='none'; video.style.display='block'; requestAnimationFrame(()=> video.style.opacity = 1); }, 180);
    }

    toGallery.addEventListener('click', showGallery);
    toVideo.addEventListener('click', showVideo);
    back.addEventListener('click', showGallery);

    document.querySelectorAll('.thumb').forEach(t => {
      t.addEventListener('click', () => {
        const title = t.getAttribute('data-title') || 'Selected Video';
        nowPlaying.textContent = `Now Playing • ${title}`;
        showVideo();
      });
    });

    // Demo progress animation (only in Video view)
    let p = 0;
    setInterval(()=>{
      if (video.style.display !== 'block') return;
      p = (p + 1) % 100; fill.style.width = `${p}%`;
    }, 80);

    // Start in Gallery
    showGallery();
  </script>
</body>
</html>
